[project]
name = "utopiai"
version = "0.1.0"
description = "Plataforma de personagens com RP e memoria auditavel"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "character-card @ git+https://github.com/roleplay-studio/character-card.git",
  "litellm>=1.70,<2",
  "psycopg[binary]>=3.2,<4",
  "python-telegram-bot>=22,<23",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
utopiai-bot = "utopiai.telegram:main"
utopiai-worker = "utopiai.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utopiai"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
